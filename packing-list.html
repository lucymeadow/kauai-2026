<!DOCTYPE html>
<html lang="en">

    .header-inner { max-width: 820px; margin: 0 auto; }
    .header-sub {

      letter-spacing: 0.2em;
      color: #7ecdc4;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .header-row {

      color: #0a2a3a;
      border: none;
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 12px;
      font-family: inherit;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      font-weight: 700;
    }
    .btn-export:hover { background: #5bb8ae; }
    .layout {
      max-width: 820px;
      margin: 0 auto;
      padding: 24px 32px;
      display: flex;
      gap: 24px;
    }
    .sidebar { width: 200px; flex-shrink: 0; }
    .cat-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 8px;
      padding: 9px 12px;
      margin-bottom: 4px;
      cursor: pointer;
      color: #a0bfc4;
      font-family: inherit;
      font-size: 13px;
      text-align: left;
      transition: all 0.15s;
    }
    .cat-btn:hover { color: #7ecdc4; background: rgba(126,205,196,0.08); }
    .cat-btn.active {
      background: rgba(126,205,196,0.15);
      border-color: rgba(126,205,196,0.3);
      color: #7ecdc4;
    }
    .cat-btn.view-all-btn {
      color: #f0ede6;
      border-color: rgba(255,255,255,0.12);
      background: rgba(255,255,255,0.05);
      margin-bottom: 12px;
      font-weight: 700;
    }
    .cat-btn.view-all-btn:hover { background: rgba(255,255,255,0.1); }
    .cat-btn.view-all-btn.active {
      background: rgba(126,205,196,0.2);
      border-color: rgba(126,205,196,0.4);
      color: #7ecdc4;
    }
    .cat-badge {
      background: rgba(126,205,196,0.25);
      color: #7ecdc4;
      border-radius: 10px;
      padding: 1px 7px;
      font-size: 11px;
      font-weight: 700;
    }
    .cat-btn.active .cat-badge {
      background: #7ecdc4;
      color: #0a2a3a;
    }
    .panel {
      flex: 1;
      min-width: 0;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      overflow: hidden;
    }
    .panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
    }
    .panel-header .icon { font-size: 20px; }
    .items-list { padding: 8px 0; }

    /* category section headers in View All mode */
    .section-heading {
      padding: 10px 20px 6px;
      font-size: 11px;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: #7ecdc4;
      border-top: 1px solid rgba(255,255,255,0.06);
      margin-top: 4px;
    }
    .section-heading:first-child { border-top: none; margin-top: 0; }

    /* item rows */
    .item-row {
      display: flex;
      align-items: center;
      padding: 9px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      gap: 12px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .item-row:hover { background: rgba(255,255,255,0.03); }
    .item-row:last-child { border-bottom: none; }

    /* custom checkbox */
    .item-check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid rgba(126,205,196,0.4);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
      background: transparent;
    }
    .item-row.checked .item-check {
      background: #7ecdc4;
      border-color: #7ecdc4;
    }
    .item-check::after {
      content: '';
      display: none;
      width: 5px;
      height: 9px;
      border: 2px solid #0a2a3a;
      border-top: none;
      border-left: none;
      transform: rotate(45deg) translate(-1px, -1px);
    }
    .item-row.checked .item-check::after { display: block; }

    .item-text { flex: 1; }
    .item-name { font-size: 14px; color: #f0ede6; transition: all 0.15s; }
    .item-note { font-size: 12px; color: #7ecdc4; margin-top: 2px; opacity: 0.8; }
    .item-row.checked .item-name {
      text-decoration: line-through;
      color: rgba(240,237,230,0.35);
    }
    .item-row.checked .item-note { opacity: 0.35; }

    .btn-remove {
      background: none;
      border: none;
      color: rgba(160,191,196,0.25);
      cursor: pointer;
      font-size: 18px;
      padding: 0 4px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.15s;
    }
    .btn-remove:hover { color: #e07070; }

    .empty-msg {
      padding: 24px 20px;
      color: rgba(160,191,196,0.5);
      font-size: 13px;
      font-style: italic;
    }
    .add-row {

      border-top: 1px solid rgba(255,255,255,0.06);
      background: rgba(0,0,0,0.1);
      display: flex;
      gap: 8px;
      flex-wrap: wrap;

    .add-row input {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 6px;
      padding: 8px 12px;
      color: #f0ede6;
      font-size: 13px;
      font-family: inherit;
      outline: none;

    .add-row input:focus { border-color: rgba(126,205,196,0.4); }
    .input-item { flex: 1 1 140px; }
    .input-note { flex: 2 1 180px; }
    .btn-add {

      color: #0a2a3a;
      border: none;
      border-radius: 6px;
      padding: 8px 18px;
      font-size: 13px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    @media (max-width: 600px) {

      .sidebar { width: 100%; display: flex; flex-wrap: wrap; gap: 4px; }
      .cat-btn { width: auto; flex: 1 1 auto; }
      .cat-btn.view-all-btn { width: 100%; flex: 1 1 100%; }
    }
  </style>
</head>

function totalItems() {
  return Object.values(items).reduce((s, arr) => s + arr.length, 0);
}

function itemRow(i, removeCat) {
  const checked = checkedIds.has(i.id) ? 'checked' : '';
  const cat = removeCat || activeCategory;
  return `
    <div class="item-row ${checked}" onclick="toggleCheck(${i.id})">
      <div class="item-check"></div>
      <div class="item-text">
        <div class="item-name">${escHtml(i.item)}</div>
        ${i.note ? `<div class="item-note">${escHtml(i.note)}</div>` : ''}
      </div>
      <button class="btn-remove" onclick="event.stopPropagation();removeItem(${i.id},'${cat.replace(/'/g,"\\'")}')" title="Remove">×</button>
    </div>`;
}

  const isAll = activeCategory === VIEW_ALL;

  const total = totalItems();

      <span>📋 View All</span><span class="cat-badge">${total}</span>
    </button>` +
    CATEGORIES.map(cat => {
      const count = items[cat].length;
      const active = cat === activeCategory ? 'active' : '';
      const badge = count > 0 ? `<span class="cat-badge">${count}</span>` : '';
      return `<button class="cat-btn ${active}" onclick="setCategory('${cat.replace(/'/g,"\\'")}')">

  // Panel header
  if (isAll) {
    document.getElementById('panel-icon').textContent = '📋';
    document.getElementById('panel-title').textContent = 'All Items';
  } else {
    document.getElementById('panel-icon').textContent = ICONS[activeCategory];
    document.getElementById('panel-title').textContent = activeCategory;
  }

  // Items
  const list = document.getElementById('items-list');
  if (isAll) {
    let html = '';
    CATEGORIES.forEach(cat => {
      const catItems = items[cat];
      if (catItems.length === 0) return;
      html += `<div class="section-heading">${ICONS[cat]} ${escHtml(cat)}</div>`;
      html += catItems.map(i => itemRow(i, cat)).join('');
    });
    list.innerHTML = html || '<div class="empty-msg">Nothing here yet.</div>';
  } else {
    const catItems = items[activeCategory];
    if (catItems.length === 0) {
      list.innerHTML = '<div class="empty-msg">No items yet — add one below.</div>';
    } else {
      list.innerHTML = catItems.map(i => itemRow(i)).join('');
    }
  }

  // Add row visibility
  document.querySelector('.add-row').style.display = isAll ? 'none' : 'flex';

  // Count
  document.getElementById('item-count').textContent =
    packed > 0 ? `${packed} / ${total} packed` : `${total} items`;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function setCategory(cat) {
  activeCategory = cat;
  render();
}

function toggleCheck(id) {
  if (checkedIds.has(id)) {
    checkedIds.delete(id);
  } else {
    checkedIds.add(id);
  }
  render();
}

function addItem() {
  const itemEl = document.getElementById('new-item');
  const noteEl = document.getElementById('new-note');
  const val = itemEl.value.trim();
  if (!val) return;
  items[activeCategory].push({ id: nextId++, item: val, note: noteEl.value.trim() });
  itemEl.value = '';
  noteEl.value = '';
  render();
}

function removeItem(id, cat) {
  const target = cat || activeCategory;
  items[target] = items[target].filter(i => i.id !== id);
  checkedIds.delete(id);
  render();
}

function exportList() {
  let text = 'KAUAI PACKING LIST — June 13–20, 2026\n';
  text += 'Princeville, North Shore\n';
  text += '─'.repeat(40) + '\n\n';
  CATEGORIES.forEach(cat => {
    const catItems = items[cat];
    if (catItems.length === 0) return;
    text += `${ICONS[cat]} ${cat.toUpperCase()}\n`;
    catItems.forEach(i => {
      const done = checkedIds.has(i.id) ? '✓' : '○';
      text += `  ${done} ${i.item}`;
      if (i.note) text += ` — ${i.note}`;
      text += '\n';
    });
    text += '\n';
  });
  text += '─'.repeat(40) + '\n';
  const packed = checkedIds.size;
  const total = totalItems();
  text += `Packed: ${packed} / ${total} items\n`;

  const blob = new Blob([text], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'kauai-packing-list.txt';
  a.click();
  URL.revokeObjectURL(url);
}

render();
</script>
</body>
</html>
